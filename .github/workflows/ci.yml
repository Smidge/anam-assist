name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Verify committed bundle
        run: git diff --exit-code -- custom_components/anam_assist/frontend
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium webkit
      - name: Download test browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - run: npm run test:frontend
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install ruff==0.17.3
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - name: Test against pinned Home Assistant
        env:
          HA_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f
        run: |
          docker pull "$HA_IMAGE"
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /config \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work --entrypoint /bin/sh "$HA_IMAGE" \
            -c 'for test in tests/test_*.py; do python3 -B "$test" /work || exit 1; done'
