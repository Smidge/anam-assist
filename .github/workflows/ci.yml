name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Verify committed bundle
        run: git diff --exit-code -- custom_components/anam_assist/frontend
      - name: Use the Ubuntu archive for browser dependencies
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium webkit
      - name: Download test browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - run: npm run test:frontend
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pip install ruff==0.17.3
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - name: Test against pinned Home Assistant
        env:
          HA_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f
        run: |
          docker pull "$HA_IMAGE"
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /config \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work --entrypoint /bin/sh "$HA_IMAGE" \
            -c 'for test in tests/test_*.py; do python3 -B "$test" /work || exit 1; done'
